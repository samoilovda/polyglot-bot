name: Quotes Bot

on:
  schedule:
    # Публикации в 10:00, 16:00 и 22:00 по Ташкенту решает slot.py (state.json -> last_slot).
    # GitHub запаздывает с cron на часы, поэтому запускаем каждый час: первый же
    # запуск после наступления слота публикует, остальные сразу завершаются.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print, do not post'
        type: boolean
        default: false
      words:
        description: 'Run the "Words in context" post instead of a quote'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quotes-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS || 'hermes' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check publication slot
        id: slot
        env:
          FORCE_WORDS: ${{ inputs.words }}
        run: python3 slot.py

      - name: Set up Python
        if: steps.slot.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node (for Claude Code CLI)
        if: steps.slot.outputs.due == 'true' && contains(env.LLM_PROVIDERS, 'claude_cli')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        if: steps.slot.outputs.due == 'true' && contains(env.LLM_PROVIDERS, 'claude_cli')
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        if: steps.slot.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        if: steps.slot.outputs.due == 'true'
        run: pytest -q

      - name: Configure Hermes SSH
        if: steps.slot.outputs.due == 'true' && contains(env.LLM_PROVIDERS, 'hermes')
        env:
          HERMES_SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          HERMES_SSH_HOST_KEY: ${{ secrets.HERMES_SSH_HOST_KEY }}
          HERMES_SSH_DESTINATION: ${{ secrets.HERMES_SSH_TARGET }}
        run: |
          if [[ -z "$HERMES_SSH_KEY" || -z "$HERMES_SSH_HOST_KEY" || -z "$HERMES_SSH_DESTINATION" ]]; then
            echo '::warning::Hermes SSH secrets are incomplete'
            exit 0
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/hermes.XXXXXX")
          printf '%s\n' "$HERMES_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$HERMES_SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          {
            printf 'HERMES_SSH_TARGET=%s\n' "$HERMES_SSH_DESTINATION"
            printf 'HERMES_SSH_IDENTITY=%s\n' "$ssh_dir/id_ed25519"
            printf 'HERMES_SSH_KNOWN_HOSTS=%s\n' "$ssh_dir/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Run bot
        if: steps.slot.outputs.quotes_due == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'haiku' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: Run words post
        if: steps.slot.outputs.words_due == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WORDS_TG_CHAT_ID: ${{ secrets.WORDS_TG_CHAT_ID }}
          WORDBANK_URL: ${{ secrets.WORDBANK_URL }}
          WORDBANK_TOKEN: ${{ secrets.WORDBANK_TOKEN }}
          WORDS_ALLOW_LLM_IPA: ${{ vars.WORDS_ALLOW_LLM_IPA }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python words_post.py

      - name: Commit state
        if: success() && steps.slot.outputs.due == 'true' && inputs.dry_run != true
        run: |
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update quote rotation state [skip ci]"
          git push
