name: Quotes Bot

on:
  schedule:
    # Публикации в 10:00, 16:00 и 22:00 по Ташкенту решает slot.py (state.json -> last_slot).
    # GitHub запаздывает с cron на часы, поэтому запускаем каждый час: первый же
    # запуск после наступления слота публикует, остальные сразу завершаются.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print, do not post'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quotes-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check publication slot
        id: slot
        run: python3 slot.py

      - name: Set up Python
        if: steps.slot.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.slot.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        if: steps.slot.outputs.due == 'true'
        run: pytest -q

      - name: Run bot
        if: steps.slot.outputs.due == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: Commit state
        if: success() && steps.slot.outputs.due == 'true'
        run: |
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update quote rotation state [skip ci]"
          git push
