name: Quotes Bot

on:
  schedule:
    # 3 раза в день (минуты не ровные — в начале часа GitHub сильно задерживает cron)
    - cron: '7 6 * * *'    # 09:07 МСК
    - cron: '7 11 * * *'   # 14:07 МСК
    - cron: '7 17 * * *'   # 20:07 МСК
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print, do not post'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quotes-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run bot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: Commit state
        if: success()
        run: |
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update quote rotation state [skip ci]"
          git push
