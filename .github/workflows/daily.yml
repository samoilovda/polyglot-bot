name: Quotes Bot

on:
  schedule:
    # Публикации в 10:00, 16:00 и 22:00 по Ташкенту решает slot.py (state.json -> last_slot).
    # GitHub запаздывает с cron на часы, поэтому запускаем каждый час: первый же
    # запуск после наступления слота публикует, остальные сразу завершаются.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print, do not post'
        type: boolean
        default: false
      words:
        description: 'Run the "Words in context" post instead of a quote'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quotes-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      # Без токена claude CLI не нужен: llm.py всё равно пропустит claude_cli, а установка занимает время.
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check publication slot
        id: slot
        env:
          FORCE_WORDS: ${{ inputs.words }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Только для проверки «задано ли» — без них шаг Words пропускается с сообщением в логе.
          WORDS_TG_CHAT_ID: ${{ secrets.WORDS_TG_CHAT_ID }}
          WORDBANK_URL: ${{ secrets.WORDBANK_URL }}
          WORDBANK_TOKEN: ${{ secrets.WORDBANK_TOKEN }}
        run: python3 slot.py

      - name: Set up Python
        if: steps.slot.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node (for Claude Code CLI)
        if: steps.slot.outputs.due == 'true' && env.HAS_CLAUDE_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        if: steps.slot.outputs.due == 'true' && env.HAS_CLAUDE_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        if: steps.slot.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        if: steps.slot.outputs.due == 'true'
        run: pytest -q

      - name: Run bot
        if: steps.slot.outputs.quotes_due == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}  # пусто = llm.DEFAULT_PROVIDERS
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'haiku' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_FREE_MODELS: ${{ vars.OPENROUTER_FREE_MODELS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: Run words post
        if: steps.slot.outputs.words_due == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}  # пусто = llm.DEFAULT_PROVIDERS
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_FREE_MODELS: ${{ vars.OPENROUTER_FREE_MODELS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          WORDS_TG_CHAT_ID: ${{ secrets.WORDS_TG_CHAT_ID }}
          WORDBANK_URL: ${{ secrets.WORDBANK_URL }}
          WORDBANK_TOKEN: ${{ secrets.WORDBANK_TOKEN }}
          WORDS_ALLOW_LLM_IPA: ${{ vars.WORDS_ALLOW_LLM_IPA }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python words_post.py

      - name: Commit state
        if: success() && steps.slot.outputs.due == 'true'
        run: |
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "chore: update quote rotation state [skip ci]"
          git push
